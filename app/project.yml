# project.yml — XcodeGen-Definition für PodcastAI
#
#   brew install xcodegen
#   cd app && xcodegen generate && open PodcastAI.xcodeproj
#
# Zielplattformen sind iOS und macOS. iPadOS läuft über das iOS-Target mit
# TARGETED_DEVICE_FAMILY "1,2". Dazu kommen reine Player ohne KI für die Uhr
# (PodcastAIWatch, eingebettet in die iOS-App) und für Apple TV
# (PodcastAITV), siehe docs/plan-player-plattformen.md.
#
# Der Mac bekommt ein eigenes natives Target statt Catalyst: die Mediathek,
# die Wissensansicht und der Export sind auf dem Mac andere Oberflächen,
# keine breitere Telefonansicht.

name: PodcastAI

options:
  bundleIdPrefix: com.godmodeai.podcastai
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    watchOS: "27.0"
    tvOS: "27.0"
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "202610010828"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SP73Z8JWXM
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  PodcastAIKit:
    path: Packages/PodcastAIKit

targets:

  PodcastAI:
    type: application
    platform: iOS
    sources:
      - path: Apps/PodcastAI
        excludes:
          - "Info.plist"
          - "InfoCarPlay.plist"
          - "*.entitlements"
      - path: Apps/Shared
    dependencies:
      - package: PodcastAIKit
      - target: PodcastAIWidget
      - target: PodcastAIShare
      # Die Uhr-App liegt im Bündel der iOS-App („Embed Watch Content“).
      - target: PodcastAIWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile
        PRODUCT_NAME: PodcastAI
        # CarPlay Audio: ohne Wert gelten Info.plist und PodcastAI.entitlements.
        # Mit `PODCASTAI_VARIANT: CarPlay` gelten InfoCarPlay.plist und
        # PodcastAICarPlay.entitlements (mit dem Entitlement
        # com.apple.developer.carplay-audio). Erst setzen, wenn Apple die
        # Berechtigung für die App erteilt hat, sonst scheitert die
        # Signierung. Schritte: docs/plan-player-plattformen.md.
        PODCASTAI_VARIANT: ""
        INFOPLIST_FILE: "Apps/PodcastAI/Info$(PODCASTAI_VARIANT).plist"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: "Apps/PodcastAI/PodcastAI$(PODCASTAI_VARIANT).entitlements"
        # Auf dem Mac läuft die eigene Mac-App, nicht die iPhone-Fassung
        # mit Tab-Leiste in einem gestreckten Fenster.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  PodcastAIMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/PodcastAIMac
      - path: Apps/Shared
    dependencies:
      - package: PodcastAIKit
      - target: PodcastAIMacWidget
      - target: PodcastAIShareMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mac
        PRODUCT_NAME: PodcastAI
        INFOPLIST_FILE: Apps/PodcastAIMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIMac/PodcastAIMac.entitlements

  # Widget „Was ist neu“. Beide Erweiterungen lesen nur den Schnappschuss
  # aus der App Group (PodcastAIWidgetData), ohne Datenbank und ohne Modelle.
  PodcastAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/PodcastAIWidget
        excludes:
          - "*.entitlements"
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIWidgetData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile.widget
        PRODUCT_NAME: PodcastAIWidget
        INFOPLIST_FILE: Apps/PodcastAIWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PodcastAI
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIWidget/PodcastAIWidget.entitlements
        # Ein Widget hat kein eigenes App-Symbol, nur die Akzentfarbe.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES

  PodcastAIMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/PodcastAIWidget
        excludes:
          - "*.entitlements"
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIWidgetData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mac.widget
        PRODUCT_NAME: PodcastAIMacWidget
        INFOPLIST_FILE: Apps/PodcastAIWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PodcastAI
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIWidget/PodcastAIMacWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
  # „An PodcastAI senden“: nimmt Links und Audiodateien aus dem Teilen-Menü
  # und legt sie in den Eingang der App Group. Die Erweiterung legt nichts
  # an; die App zeigt beim nächsten Öffnen die Vorschau. Sie hängt nur am
  # kleinen Paketprodukt PodcastAIShareInbox (Foundation, Linkregeln), nicht
  # an Datenbank, Medien oder Modellen.
  PodcastAIShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ShareExtension/Shared
      - path: Apps/ShareExtension/iOS
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIShareInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile.share
        PRODUCT_NAME: PodcastAIShare
        INFOPLIST_FILE: Apps/ShareExtension/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/ShareExtension/iOS/PodcastAIShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  PodcastAIShareMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/ShareExtension/Shared
      - path: Apps/ShareExtension/macOS
      # Das Symbol der App im Teilen-Menü des Mac.
      - path: Apps/Shared/Assets.xcassets
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIShareInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mac.share
        PRODUCT_NAME: PodcastAIShare
        INFOPLIST_FILE: Apps/ShareExtension/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/ShareExtension/macOS/PodcastAIShareMac.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  # Apple Watch: reiner Player ohne KI. Eingebettet in die iOS-App, läuft
  # auch ohne iPhone. Hängt nur am Paketprodukt PodcastAIPlayerKit (Core,
  # Quellen, Medien), nicht an Wissen, Intelligenz oder Transkription.
  # Entitlements: nur iCloud (CloudKit-Container wie die anderen Apps).
  # Eigener Katalog: dasselbe App-Symbol (icon-1024.png, gleiche Bytes wie in
  # Apps/Shared), aber ein watchOS-Eintrag, der im gemeinsamen Katalog beim
  # Mac-Bau warnen würde, und eine hellere Akzentfarbe, weil die Uhr keine
  # dunkle Fassung einer Farbe kennt.
  PodcastAIWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/PodcastAIWatch
        excludes:
          - "*.entitlements"
      - path: Apps/PlayerShared
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIPlayerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile.watchkitapp
        PRODUCT_NAME: PodcastAI
        INFOPLIST_FILE: Apps/PodcastAIWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIWatch/PodcastAIWatch.entitlements
        # Keine App Intents: sonst meldet der Metadaten-Schritt bei jedem Bau
        # „Metadata extraction skipped“.
        LM_SKIP_METADATA_EXTRACTION: YES
        SKIP_INSTALL: YES

  # Apple TV: reiner Player ohne KI, eigene App mit eigener Bundle-ID. Hängt
  # nur am Paketprodukt PodcastAIPlayerKit. Entitlements: nur iCloud. Das
  # Symbol liegt als Ebenen im eigenen Katalog (scripts/make-tv-icons.py
  # erzeugt ihn aus dem App-Symbol).
  PodcastAITV:
    type: application
    platform: tvOS
    sources:
      - path: Apps/PodcastAITV
        excludes:
          - "*.entitlements"
      - path: Apps/PlayerShared
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIPlayerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.tv
        PRODUCT_NAME: PodcastAI
        INFOPLIST_FILE: Apps/PodcastAITV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAITV/PodcastAITV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        LM_SKIP_METADATA_EXTRACTION: YES

  PodcastAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PodcastAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PodcastAI

  # UI-Tests der Mac-App: Bereiche, Inspektor, Hilfe und Regel 1.
  PodcastAIMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITestsMac
    dependencies:
      - target: PodcastAIMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PodcastAIMac

  PodcastAIKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/PodcastAIKit/Tests
    dependencies:
      - package: PodcastAIKit
      # Die Tests des Players binden das Paketprodukt ein, das die Apps nur
      # auf Uhr und Fernseher benutzen.
      - package: PodcastAIKit
        product: PodcastAIPlayerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PodcastAI:
    build:
      targets: { PodcastAI: all, PodcastAIUITests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [PodcastAIUITests]
    archive: { config: Release }

  PodcastAIMac:
    build:
      targets: { PodcastAIMac: all, PodcastAIKitTests: [test], PodcastAIMacUITests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [PodcastAIKitTests, PodcastAIMacUITests]
    archive: { config: Release }

  # Apple Watch: Scheme für Simulator und Gerät. Gebaut wird die Uhr-App
  # auch über das Schema PodcastAI, weil sie dort eingebettet ist.
  PodcastAIWatch:
    build:
      targets: { PodcastAIWatch: all }
    run: { config: Debug }
    archive: { config: Release }

  PodcastAITV:
    build:
      targets: { PodcastAITV: all }
    run: { config: Debug }
    archive: { config: Release }
