# project.yml — XcodeGen-Definition für PodcastAI
#
#   brew install xcodegen
#   cd app && xcodegen generate && open PodcastAI.xcodeproj
#
# Zielplattformen sind iOS und macOS. iPadOS läuft über das iOS-Target mit
# TARGETED_DEVICE_FAMILY "1,2"; watchOS ist bewusst nicht enthalten.
#
# Der Mac bekommt ein eigenes natives Target statt Catalyst: die Mediathek,
# die Wissensansicht und der Export sind auf dem Mac andere Oberflächen,
# keine breitere Telefonansicht.

name: PodcastAI

options:
  bundleIdPrefix: com.godmodeai.podcastai
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.13"
    CURRENT_PROJECT_VERSION: "202609260717"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SP73Z8JWXM
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  PodcastAIKit:
    path: Packages/PodcastAIKit

targets:

  PodcastAI:
    type: application
    platform: iOS
    sources:
      - path: Apps/PodcastAI
      - path: Apps/Shared
    dependencies:
      - package: PodcastAIKit
      - target: PodcastAIWidget
      - target: PodcastAIShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile
        PRODUCT_NAME: PodcastAI
        INFOPLIST_FILE: Apps/PodcastAI/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAI/PodcastAI.entitlements

  PodcastAIMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/PodcastAIMac
      - path: Apps/Shared
    dependencies:
      - package: PodcastAIKit
      - target: PodcastAIMacWidget
      - target: PodcastAIShareMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mac
        PRODUCT_NAME: PodcastAI
        INFOPLIST_FILE: Apps/PodcastAIMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIMac/PodcastAIMac.entitlements

  # Widget „Was ist neu“. Beide Erweiterungen lesen nur den Schnappschuss
  # aus der App Group (PodcastAIWidgetData), ohne Datenbank und ohne Modelle.
  PodcastAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/PodcastAIWidget
        excludes:
          - "*.entitlements"
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIWidgetData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile.widget
        PRODUCT_NAME: PodcastAIWidget
        INFOPLIST_FILE: Apps/PodcastAIWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PodcastAI
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIWidget/PodcastAIWidget.entitlements
        # Ein Widget hat kein eigenes App-Symbol, nur die Akzentfarbe.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES

  PodcastAIMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/PodcastAIWidget
        excludes:
          - "*.entitlements"
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIWidgetData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mac.widget
        PRODUCT_NAME: PodcastAIMacWidget
        INFOPLIST_FILE: Apps/PodcastAIWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PodcastAI
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIWidget/PodcastAIMacWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
  # „An PodcastAI senden“: nimmt Links und Audiodateien aus dem Teilen-Menü
  # und legt sie in den Eingang der App Group. Die Erweiterung legt nichts
  # an; die App zeigt beim nächsten Öffnen die Vorschau. Sie hängt nur am
  # kleinen Paketprodukt PodcastAIShareInbox (Foundation, Linkregeln), nicht
  # an Datenbank, Medien oder Modellen.
  PodcastAIShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ShareExtension/Shared
      - path: Apps/ShareExtension/iOS
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIShareInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile.share
        PRODUCT_NAME: PodcastAIShare
        INFOPLIST_FILE: Apps/ShareExtension/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/ShareExtension/iOS/PodcastAIShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  PodcastAIShareMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/ShareExtension/Shared
      - path: Apps/ShareExtension/macOS
      # Das Symbol der App im Teilen-Menü des Mac.
      - path: Apps/Shared/Assets.xcassets
    dependencies:
      - package: PodcastAIKit
        product: PodcastAIShareInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mac.share
        PRODUCT_NAME: PodcastAIShare
        INFOPLIST_FILE: Apps/ShareExtension/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/ShareExtension/macOS/PodcastAIShareMac.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  PodcastAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PodcastAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PodcastAI

  PodcastAIKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/PodcastAIKit/Tests
    dependencies:
      - package: PodcastAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godmodeai.podcastai.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PodcastAI:
    build:
      targets: { PodcastAI: all, PodcastAIUITests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [PodcastAIUITests]
    archive: { config: Release }

  PodcastAIMac:
    build:
      targets: { PodcastAIMac: all, PodcastAIKitTests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [PodcastAIKitTests]
    archive: { config: Release }
