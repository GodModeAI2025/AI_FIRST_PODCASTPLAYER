# project.yml — XcodeGen-Definition für PodcastAI
#
#   brew install xcodegen
#   cd app && xcodegen generate && open PodcastAI.xcodeproj
#
# Zielplattformen sind iOS und macOS. iPadOS läuft über das iOS-Target mit
# TARGETED_DEVICE_FAMILY "1,2"; watchOS ist bewusst nicht enthalten — der
# Auftrag nannte iOS und macOS. Die Sperrdatei führt watchOS 27.0 weiterhin
# als Zielplattform des Gesamtprodukts; dieses Projekt setzt sie nicht um.
#
# Der Mac bekommt ein eigenes natives Target statt Catalyst: die Mediathek,
# die Wissensansicht und der Export sind auf dem Mac andere Oberflächen,
# keine breitere Telefonansicht.

name: PodcastAI

options:
  bundleIdPrefix: com.podcastai
  # 27-only. Das ist keine freie Wahl: `config/toolchain-lock.json` trägt
  # `"policy": "latest-apple-native-27-only"` mit 27.0 für alle vier
  # Plattformen, und `AGENTS.md` Punkt 3 macht sie verbindlich. Der Code
  # stand hier auf 26.0 — das war eine Abweichung, die als offene
  # Entscheidung D7 getarnt war, obwohl sie längst entschieden ist.
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  PodcastAIKit:
    path: Packages/PodcastAIKit

targets:

  PodcastAI:
    type: application
    platform: iOS
    sources:
      - path: Apps/PodcastAI
      - path: Apps/Shared
    dependencies:
      - package: PodcastAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podcastai.app
        PRODUCT_NAME: PodcastAI
        INFOPLIST_FILE: Apps/PodcastAI/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAI/PodcastAI.entitlements

  PodcastAIMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/PodcastAIMac
      - path: Apps/Shared
    dependencies:
      - package: PodcastAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podcastai.mac
        PRODUCT_NAME: PodcastAI
        INFOPLIST_FILE: Apps/PodcastAIMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/PodcastAIMac/PodcastAIMac.entitlements

  PodcastAIKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/PodcastAIKit/Tests
    dependencies:
      - package: PodcastAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podcastai.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PodcastAI:
    build:
      targets: { PodcastAI: all }
    run: { config: Debug }
    archive: { config: Release }

  PodcastAIMac:
    build:
      targets: { PodcastAIMac: all, PodcastAIKitTests: [test] }
    run: { config: Debug }
    test:
      config: Debug
      targets: [PodcastAIKitTests]
    archive: { config: Release }
